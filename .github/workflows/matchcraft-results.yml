name: Matchcraft verified football results
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "EXTRA CREDIT SPEND: collect every result since Aug 2026? Leave OFF for ordinary results refresh."
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '40 20 * * *'
    - cron: '30 2 * * *'
permissions:
  contents: write
concurrency:
  group: matchcraft-football-results
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify offline result caching and quota protection
        run: node --test results_collector.test.mjs
      - name: Collect completed-match scores from subscribed TheStatsAPI
        env:
          STATS_API_KEY: ${{ secrets.STATS_API_KEY }}
          BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill == true && '1' || '0' }}
        run: node results_collector.mjs
      - name: Publish validated score snapshots
        run: |
          git config user.name "matchcraft-results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/results/latest.json data/results/????-??-??.json
          if git diff --cached --quiet; then
            echo "Results unchanged."
          else
            git commit -m "Update source-verified football final results"
            git push
          fi
